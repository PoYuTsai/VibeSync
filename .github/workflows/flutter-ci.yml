# .github/workflows/flutter-ci.yml
# PR gate: analysis and the complete Flutter test suite are blocking.
# The suite runs serially because several tests share process-global Hive and
# Supabase state; parallel workers can otherwise create false red runs.
#
# Security note (per GitHub Actions injection guide):
# 此 workflow 不消費任何 untrusted user input。唯一 ${{ }} expression 是
# concurrency.group 內的 `github.ref`，controlled context，不進 run: shell。
# command injection surface = 0。

name: Flutter CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-contracts:
    name: Edge contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Type-check keyboard function
        run: deno check supabase/functions/keyboard-reply/*.ts

      - name: Run Edge contract tests
        run: >-
          deno test --allow-env --allow-read
          supabase/functions/keyboard-reply
          supabase/functions/_shared/model_rate_limit_test.ts
          supabase/functions/_shared/operational_error_monitor_test.ts
          supabase/functions/_shared/quota_test.ts
          supabase/functions/analyze-chat/logger_test.ts
          supabase/functions/analyze-chat/index_test.ts
          supabase/functions/analyze-chat/streaming_fallback_test.ts
          supabase/functions/analyze-chat/stream_branch_test.ts
          supabase/functions/practice-chat/moments_schedule_test.ts

  ios-keyboard-compile:
    name: iOS keyboard compile
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Compile app and keyboard extension
        run: flutter build ios --simulator --debug

  test-and-analyze:
    name: Test & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Traditional Chinese visual-test font
        # 2026-08-19：apt 的 azure mirror 空轉會耗掉數分鐘（#471、4ddabc5a、
        # run 32173679991）。改抓釘版單檔 .otf 跳過 apt；sha256 對拍防來源被動
        # 手腳。另放一份到 apt 原本的 .ttc 路徑：8 個 visual_proof 測試檔候選
        # 只列 .ttc，FontLoader 只看 bytes 不看副檔名，單檔 otf 放這名字照吃、
        # 還避開 ttc 集合檔靜默豆腐坑。
        timeout-minutes: 5
        run: |
          FONT=NotoSansCJKtc-Regular.otf
          SHA=dce08bd4fd91aa8aa76ed8fea4b694c2dfb8550f67871e326843212ddbeb88b4
          curl -fsSL --retry 3 --retry-all-errors -o "$FONT" \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTF/TraditionalChinese/$FONT"
          echo "$SHA  $FONT" | sha256sum -c -
          sudo install -D "$FONT" "/usr/share/fonts/opentype/noto/$FONT"
          sudo install -D "$FONT" /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

      # build_runner 產生的 .g.dart / .freezed.dart 不在 git；少了會讓
      # `flutter analyze` 報幾百個 phantom missing-import error。distribute.yml
      # 走同一步驟。
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run full test suite serially
        run: flutter test --concurrency=1

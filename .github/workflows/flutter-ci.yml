# .github/workflows/flutter-ci.yml
# PR gate: analysis and the complete Flutter test suite are blocking.
# The suite runs serially because several tests share process-global Hive and
# Supabase state; parallel workers can otherwise create false red runs.
#
# Security note (per GitHub Actions injection guide):
# 此 workflow 不消費任何 untrusted user input。唯一 ${{ }} expression 是
# concurrency.group 內的 `github.ref`，controlled context，不進 run: shell。
# command injection surface = 0。

name: Flutter CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-contracts:
    name: Edge contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      - name: Type-check keyboard function
        run: deno check supabase/functions/keyboard-reply/*.ts

      # 動態貼文生成端會被 handler.ts 的 practice_moments 分支載入，但整個
      # practice-chat 目錄不在 CI 的測試名單裡，型別錯誤只會在部署時才炸。
      - name: Type-check practice moments generation
        run: deno check supabase/functions/practice-chat/moments_handler.ts

      # 1:1 記憶接線（PR D）動到 prompt.ts 與 handler.ts 的聊天主路徑，
      # 迴歸證據在 index_test.ts（239 條既有 ＋ 7 條接線行為）與 prompt_test.ts。
      # 在此之前這兩支都不在白名單裡＝聊天主路徑在 PR CI 完全沒有守門。
      #
      # 註解只能放在這裡：下面是 `>-` 折疊純量，換行會折成空格，
      # 行內 `#` 會讓 shell 把後面所有測試檔一起吃掉。
      - name: Run Edge contract tests
        run: >-
          deno test --allow-env --allow-read
          supabase/functions/keyboard-reply
          supabase/functions/_shared/model_rate_limit_test.ts
          supabase/functions/_shared/zh_tw_visible_text_guard_test.ts
          supabase/functions/coach-chat/prompts_test.ts
          supabase/functions/coach-chat/generation_test.ts
          supabase/functions/coach-chat/validate_test.ts
          supabase/functions/coach-chat/clarification_policy_test.ts
          supabase/functions/_shared/operational_error_monitor_test.ts
          supabase/functions/_shared/quota_test.ts
          supabase/functions/analyze-chat/logger_test.ts
          supabase/functions/analyze-chat/index_test.ts
          supabase/functions/analyze-chat/streaming_fallback_test.ts
          supabase/functions/analyze-chat/stream_branch_test.ts
          supabase/functions/analyze-chat/guardrails_test.ts
          supabase/functions/analyze-chat/no_send_decision_test.ts
          supabase/functions/analyze-chat/no_send_stream_test.ts
          supabase/functions/practice-chat/moments_schedule_test.ts
          supabase/functions/practice-chat/moments_migration_source_test.ts
          supabase/functions/practice-chat/moments_slot_states_migration_source_test.ts
          supabase/functions/practice-chat/moments_images_migration_source_test.ts
          supabase/functions/practice-chat/moments_constants_test.ts
          supabase/functions/practice-chat/moments_image_gate_test.ts
          supabase/functions/practice-chat/moments_time_test.ts
          supabase/functions/practice-chat/moments_prompt_test.ts
          supabase/functions/practice-chat/moments_validate_test.ts
          supabase/functions/practice-chat/moments_handler_test.ts
          supabase/functions/practice-chat/moments_edge_contract_test.ts
          supabase/functions/practice-chat/moments_generated_only_source_test.ts
          supabase/functions/practice-chat/moments_dispatch_test.ts
          supabase/functions/practice-chat/moments_image_gen_test.ts
          supabase/functions/practice-chat/moments_image_flow_test.ts
          supabase/functions/practice-chat/moments_image_sweep_test.ts
          supabase/functions/practice-chat/visible_text_guard_test.ts
          supabase/functions/practice-chat/moments_memory_test.ts
          supabase/functions/practice-chat/time_context_test.ts
          supabase/functions/practice-chat/index_test.ts
          supabase/functions/delete-account/cleanup_alert_test.ts
          supabase/functions/practice-chat/prompt_test.ts

      # PGlite（WASM Postgres）獨立成一步：它是唯一會拉 npm 套件的測試（約 8 秒），
      # 分開跑讓上面那組純函式契約測試 fail fast，失敗時也一眼看得出是資料層掛了。
      #
      # 權限刻意比上面那一步更窄——只有 --allow-read，連 --allow-env 都不給
      # （2026-08-22 複審 P2-2）。原本寫的
      # `--allow-env --allow-read --allow-net --allow-write --allow-sys`
      # 是照抄推測，實測後四個旗標全部不需要：deno 2.9.5 下逐一移除後 13 條測試
      # 仍全過，全部拿掉只留 --allow-read 也全過；完全不給權限才會出現
      # `NotCapable: Requires read access`。npm 套件下載屬模組解析，不歸 --allow-net 管。
      # 不縮成 --allow-read=supabase，因為還要讀 deno 的 npm cache，其路徑隨
      # DENO_DIR 與執行環境而異，寫死會比不限定更脆弱。
      - name: Run Edge Postgres contract tests
        run: >-
          deno test --allow-read
          supabase/functions/practice-chat/moments_migration_postgres_test.ts
          supabase/functions/practice-chat/moments_images_migration_postgres_test.ts
          supabase/functions/analyze-chat/stream_runs_decision_kind_migration_postgres_test.ts
          supabase/functions/analyze-chat/retention_cleanup_migration_postgres_test.ts

  ios-keyboard-compile:
    name: iOS keyboard compile
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Compile app and keyboard extension
        run: flutter build ios --simulator --debug

  test-and-analyze:
    name: Test & Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Traditional Chinese visual-test font
        # 2026-08-19：apt 的 azure mirror 空轉會耗掉數分鐘（#471、4ddabc5a、
        # run 32173679991）。改抓釘版單檔 .otf 跳過 apt；sha256 對拍防來源被動
        # 手腳。另放一份到 apt 原本的 .ttc 路徑：8 個 visual_proof 測試檔候選
        # 只列 .ttc，FontLoader 只看 bytes 不看副檔名，單檔 otf 放這名字照吃、
        # 還避開 ttc 集合檔靜默豆腐坑。
        timeout-minutes: 5
        run: |
          FONT=NotoSansCJKtc-Regular.otf
          SHA=dce08bd4fd91aa8aa76ed8fea4b694c2dfb8550f67871e326843212ddbeb88b4
          curl -fsSL --retry 3 --retry-all-errors -o "$FONT" \
            "https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTF/TraditionalChinese/$FONT"
          echo "$SHA  $FONT" | sha256sum -c -
          sudo install -D "$FONT" "/usr/share/fonts/opentype/noto/$FONT"
          sudo install -D "$FONT" /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc

      # build_runner 產生的 .g.dart / .freezed.dart 不在 git；少了會讓
      # `flutter analyze` 報幾百個 phantom missing-import error。distribute.yml
      # 走同一步驟。
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run full test suite serially
        run: flutter test --concurrency=1

  # 電子書內容稽核（ADR #45）。工具只用 Python 標準函式庫，ubuntu-latest 內建 python3，
  # 不裝套件。--baseline 是棘輪：只擋 tools/content/audit_baseline.json 以外的新發現，
  # 既有問題由內容工作包 1–6 逐批清掉並縮小 baseline。沒有任何 ${{ }} expression。
  ebook-content-audit:
    name: Ebook content audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Content tool unit tests
        run: python3 -m unittest discover -s tools/content/tests -v

      - name: Audit ebook copy against baseline
        run: python3 tools/content/audit_ebook_copy.py assets/learning/ebooks --baseline tools/content/audit_baseline.json

# .github/workflows/deploy-web.yml
# Flutter Web 自動部署到 Vercel

name: Deploy Web to Vercel

on:
  push:
    branches: [main]
    # Workflow-only maintenance must not publish a fresh production web build.
    # Use workflow_dispatch when the deployment workflow itself needs testing.
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:  # 允許手動觸發

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Keep web deploys on the same known-green toolchain as CI and release.
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Debug Flutter info
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get -v

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build web
        run: flutter build web --release

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: |
          cd build/web
          vercel deploy --prod --token="$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
